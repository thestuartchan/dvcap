# UAE (DFM / ADX) holidays, from DFM's own circulars (scripts/holidays-uae-fetch.py → .mjs).
#
# WHY TWICE A DAY. Eid, Arafat Day, the Hijri New Year and the Prophet's Birthday follow the moon;
# DFM confirms each 5–14 days ahead. A closure the regulator orders comes at a day's notice — DFM's
# "Market Closure" 03/2026 was issued Sunday 1 March for Monday 2 March — and its "Resumption of
# Trading" when it ends. So the job looks every morning (04:35 UTC, before the 10:00 Dubai open)
# and every evening (16:35 UTC, after announcements made past the close). GitHub runs schedules
# hours late at times; either run landing before the next open is enough.
#
# QUIET. A run that finds the same dates leaves the file untouched, so nothing is committed and the
# site does not redeploy; the check is recorded on a change, or weekly as a heartbeat.
#
# WHERE IT GOES. data/holidays.json (UAE, _uae), committed to main only when a date changed;
# the commit redeploys. The log prints counts and public exchange dates — nothing about the account.
name: holidays uae

on:
  schedule:
    - cron: '35 4 * * *'
    - cron: '35 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: holidays-fetch
  cancel-in-progress: false

jobs:
  uae:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Is a check due?
        id: due
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/holidays-uae.mjs --check data/holidays.json
      - uses: actions/setup-python@v7
        if: steps.due.outputs.due == 'true'
        with:
          python-version: '3.12'
      - name: Read DFM's holiday circulars and the UAE public calendar
        if: steps.due.outputs.due == 'true'
        run: |
          pip install --quiet pypdf==6.21.1
          python scripts/holidays-uae-fetch.py "$RUNNER_TEMP/uae-sources.json"
      - name: Merge into the holiday file
        if: steps.due.outputs.due == 'true'
        run: node scripts/holidays-uae.mjs "$RUNNER_TEMP/uae-sources.json" data/holidays.json
      - name: Commit
        if: steps.due.outputs.due == 'true'
        run: |
          if git diff --quiet -- data/holidays.json; then echo "no change to commit"; exit 0; fi
          git config user.name "dvcap-bot"
          git config user.email "dvcap-bot@users.noreply.github.com"
          git add data/holidays.json
          git commit -m "Holidays auto — UAE (DFM circulars) @ $(date -u +%F)"
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main && git rebase origin/main || exit 1
            sleep $((i * 5))
          done
          echo "::error::could not push after three attempts"; exit 1
