# Daily gamma-exposure capture.
#
# NOT A VERCEL CRON, deliberately, and against the brief which asked for one. Vercel was running
# five cron entries for the pre-reads and only the first two were ever executed — the US brief went
# dark for three weekdays on 2026-08-31 and the cause was position in the list, not code. All five
# moved here on 2026-09-01. Adding a sixth Vercel entry would have put this capture in exactly the
# slot that fails, and it would have failed SILENTLY: a missed pre-read is a missing message in a
# channel, but a missed GEX snapshot is a permanent hole, because open interest is not served
# historically by any free source. That asymmetry is why this one especially cannot live there.
#
# WHY NOT PRE-OPEN, THOUGH THAT WAS THE PLAN. OCC does settle open interest overnight — but Yahoo
# does not SERVE the settled figure until the session is under way. Measured 2026-09-02 at 09:30
# UTC, four hours before the open: the 0DTE expiry returned 209 contracts carrying 922,440 of
# volume and ZERO open interest, the next weekly 364 contracts and zero, the monthly 502 and
# sixteen. A 13:00 UTC run would have captured a full chain with nothing to weight it with, every
# single day — and gamma exposure IS open interest weighted by gamma.
#
# 15:15 UTC, and it is 15:15 rather than 14:15 BECAUSE OF DST. The US open is 13:30 UTC in summer
# and 14:30 UTC in winter, so a fixed UTC cron drifts an hour against the session:
#
#   14:15 UTC   EDT -> 10:15 ET, 45 min after the open        fine
#               EST -> 09:15 ET, 15 min BEFORE the open       the exact failure just fixed
#   15:15 UTC   EDT -> 11:15 ET, 105 min after the open       fine
#               EST -> 10:15 ET,  45 min after the open       fine
#
# One entry that works in both halves of the year beats a DST pair needing a gate this endpoint
# does not have. Later in the summer session is harmless: open interest is settled overnight and
# does not move once populated, so any time after the field fills reads the same number.
#
# Dubai, where this is read, is UTC+4 year-round — so the capture lands at 19:15 local, and the US
# session runs 17:30 to 00:00 local in summer, an hour later in winter.
#
# The 22:00 UTC run is optional and additive: same-day volume and closing IV, overlaid onto the same
# dated row rather than replacing it. 22:00 for the same DST reason — 21:00 UTC is 16:00 ET in
# winter, which is the closing bell itself rather than after it. It is included because it costs one CI minute and the data cannot be recovered later.
#
# The endpoint is /api/gex?snapshot=1, not a route of its own. Vercel's Hobby plan caps a
# deployment at 12 Serverless Functions; as two routes this project hit 13 and the whole deployment
# stopped shipping, leaving the previous build live with no error anywhere obvious.
name: gex snapshot

on:
  schedule:
    - cron: '15 15 * * 1-5'   # 10:15 ET winter / 11:15 summer — after the open in BOTH
    - cron: '0 22 * * 1-5'    # 17:00 ET winter / 18:00 summer — safely AFTER the bell in both
  workflow_dispatch:
    inputs:
      dry:
        description: 'Dry run? 1 = compute but write nothing'
        required: true
        default: '1'
      symbols:
        description: 'Comma-separated symbols (blank = SPY,QQQ)'
        required: false
        default: ''

concurrency:
  group: gex-snapshot
  cancel-in-progress: false     # never abandon a half-written capture

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Capture the chain
        run: |
          DRY="${{ github.event.inputs.dry }}"
          if [ -n "${{ github.event.schedule }}" ]; then DRY=0; fi
          # Explicit, rather than inferred from the clock: the 13:00 run is canonical and the
          # 21:00 run only overlays closing figures onto it.
          case "${{ github.event.schedule }}" in
            '15 15 * * 1-5') SESSION=open ;;
            '0 22 * * 1-5') SESSION=close ;;
            *)              SESSION=open ;;
          esac
          Q="dry=${DRY:-1}&session=$SESSION"
          if [ -n "${{ github.event.inputs.symbols }}" ]; then Q="$Q&symbols=${{ github.event.inputs.symbols }}"; fi
          code=$(curl -sS -o /tmp/gex.json -w '%{http_code}' --max-time 300 \
            "https://dvcap.vercel.app/api/gex?snapshot=1&$Q") || true
          echo "HTTP $code"
          python3 - <<'PY' || cat /tmp/gex.json
          import json
          d = json.load(open('/tmp/gex.json'))
          print('date:', d.get('date'), ' rate:', d.get('rate'), f"({d.get('rateSource')})", ' dry:', d.get('dry'))
          for r in d.get('results', []):
              if not r.get('ok'):
                  print(f"  {r.get('symbol')}: FAILED — {r.get('reason')}")
              else:
                  print(f"  {r['symbol']} [{r.get('session')}]: {r['contracts']} contracts over {r['expiries']} expiries"
                        f" | flip {r.get('flip')} | GEX {r.get('gexUsd')}"
                        + (f" | FAILED EXPIRIES {r['failed']}" if r.get('failed') else '')
                        + ('' if r.get('wrote') else ' | not written (dry)'))
          PY
          [ "$code" = "200" ] || exit 1
