# The three regional pre-reads, scheduled here rather than in vercel.json.
#
# WHY THEY MOVED. Vercel ran five cron entries and only the first two were ever executed. The
# evidence, read off the endpoint's own last-post record on 2026-09-01:
#
#   asia  entry #1        last posted 08-31 23:18Z   ✓
#   eu    entries #2, #3  last posted 09-01 08:01Z   ✓ (via #2)
#   us    entries #4, #5  last posted 08-28 12:55Z   ✗ — three weekdays dark
#
# The endpoint was healthy throughout: assembleRegion returned a full brief on demand, the DST gate
# computed the right window, and the deployment was current. What failed was the schedule, and it
# failed by POSITION in the list — which is the shape of a plan cron limit, not a bug in the code.
#
# It would also have kept going. Each region has two entries, one per DST half of the year, and the
# gate accepts exactly one of them. EU is currently served by #2 (07:45Z = 08:45 BST). On 25 October
# London goes to GMT and the accepting entry becomes #3 (08:45Z) — which is past the same cut-off
# that killed US. Fixing only US would have bought eight weeks.
#
# GitHub Actions has no such cap, and this repo already schedules flex-sync and tradecard here, so
# this is the proven path rather than a new one.
#
# ON LATE RUNS — AND WHY THE SCHEDULE IS NOW A POLL. GitHub schedules are best-effort, and the
# effort on 2026-09-02 was poor enough to lose the entire day. Every run reported success:
#
#   cron 22:45 asia   ran 00:31   1h46 late   SKIPPED — off-window
#   cron 07:45 eu     ran 12:17   4h32 late   SKIPPED — off-window
#   cron 08:45 eu     ran 12:58   4h13 late   SKIPPED — off-window
#   cron 12:45 us     never ran
#   cron 13:45 us     never ran
#
# The gate was right to refuse: a brief written for 09:00 London is worthless at 13:58, and
# widening the window to accept it would deliver a stale brief rather than fix anything. The
# endpoint was healthy, the deployment current, the code correct. The scheduler simply did not
# turn up — the same failure shape as the Vercel cron cap, one layer out.
#
# So a single precisely-timed firing is the wrong bet. Each scheduled invocation is queued
# INDEPENDENTLY, so many attempts spread across the hours that matter give the gate several
# chances to catch one inside its window, and one arriving on time is enough. Attempts sit on odd
# minutes: :00, :15, :30 and :45 are the most contended minutes on the platform, and :45 is
# exactly where all five of the old entries sat.
#
# THE DST PAIRS ARE GONE. They existed because Vercel fires a cron line once and the UTC hour of a
# local 09:00 moves twice a year. Polling removes the need entirely — the gate resolves each
# region's real local time through Intl on every attempt, so it is DST-correct by construction and
# the 25 Oct and 1 Nov landmines are defused rather than rescheduled.
#
# SAFE ONLY BECAUSE OF THE DEDUPE. Several attempts landing in one window would post the brief
# several times. api/preread.js now refuses a region that has already delivered on its own local
# calendar date, so the extra attempts are no-ops that say so. The two changes ship together and
# neither is correct alone.
#
# COVERAGE, checked against the gate's own window [target-15min, target+40min). Every case gets
# three in-window attempts, in both DST halves:
#
#   asia  23:00 UTC  window 22:45-23:40   ->  23:07  23:23  23:39
#   eu    08:00 UTC  window 07:45-08:40   ->  08:07  08:23  08:39   (BST)
#         09:00 UTC  window 08:45-09:40   ->  09:07  09:23  09:39   (GMT)
#   us    13:00 UTC  window 12:45-13:40   ->  13:07  13:23  13:39   (EDT)
#         14:00 UTC  window 13:45-14:40   ->  14:07  14:23  14:39   (EST)
#
# COST: 24 attempts a weekday, one job each, ~1 min billed — 120 runs/week, ~520/month against
# 2,000 free. Each job calls all three regions, but that is three HTTP requests inside one job.

name: pre-read

on:
  schedule:
    # Asia targets 07:00 HKT = 23:00 UTC year-round (no DST in HK/KR/TW/JP).
    - cron: '7,23,39 22-23 * * 0-4'
    # Europe targets 09:00 London = 08:00 UTC in BST, 09:00 UTC in GMT. Both covered.
    - cron: '7,23,39 7-9 * * 1-5'
    # US targets 09:00 ET = 13:00 UTC in EDT, 14:00 UTC in EST. Both covered.
    - cron: '7,23,39 12-14 * * 1-5'
  workflow_dispatch:
    inputs:
      region:
        description: 'Region to run (asia | eu | us)'
        required: true
        default: 'us'
      post:
        description: 'Post to Discord? 0 = dry run, 1 = post for real'
        required: true
        default: '0'
      gate:
        description: 'Apply the time-window gate? 1 = yes (as scheduled), 0 = force'
        required: true
        default: '1'

concurrency:
  group: preread
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Decide what this run is allowed to do
        id: pick
        run: |
          # A scheduled attempt no longer maps to one region — it tries all three and the gate
          # decides which, if any, is due. Only a manual run picks a single region, and only a
          # manual run may skip the gate or suppress the post.
          if [ -n "${{ github.event.schedule }}" ]; then
            echo "regions=asia eu us" >> "$GITHUB_OUTPUT"
            echo "post=1"             >> "$GITHUB_OUTPUT"
            echo "gate=1"             >> "$GITHUB_OUTPUT"
          else
            echo "regions=${{ github.event.inputs.region }}" >> "$GITHUB_OUTPUT"
            echo "post=${{ github.event.inputs.post }}"      >> "$GITHUB_OUTPUT"
            echo "gate=${{ github.event.inputs.gate }}"      >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble and deliver the brief
        run: |
          set -u
          fail=0
          for R in ${{ steps.pick.outputs.regions }}; do
            Q="region=$R&post=${{ steps.pick.outputs.post }}"
            [ "${{ steps.pick.outputs.gate }}" = "1" ] && Q="$Q&cron=1"
            code=$(curl -sS -o "/tmp/$R.json" -w '%{http_code}' --max-time 180 \
              "https://dvcap.vercel.app/api/preread?$Q") || true
            echo "── $R — HTTP $code"
            # `skipped` is a normal answer: most attempts are outside the window by design, and one
            # that lands after the brief already went says so. Print the reason either way, so a
            # genuinely missed day stays legible in the log.
            # Python opens the file itself rather than taking it on stdin: a heredoc and a `<`
            # redirect both claim fd 0, the redirect wins, and python would read the JSON as its
            # own program. A `|| cat` fallback would have hidden that on every single run.
            R="$R" python3 - <<'PY' || cat "/tmp/$R.json"
          import json, os
          r = os.environ['R']
          d = json.load(open(f'/tmp/{r}.json'))
          if d.get('skipped'): print('   SKIPPED —', d.get('reason'))
          else:
              p = d.get('posted')
              print('   posted:', json.dumps(p) if p else '(dry run, not posted)')
              print('   previous run:', json.dumps(d.get('previous')))
              print('   brief bytes:', len(d.get('message') or ''))
          PY
            [ "$code" = "200" ] || fail=1
          done
          exit $fail
