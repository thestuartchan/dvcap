# Posts the wallet card when the wallet's COMPOSITION changes.
#
# WHY GITHUB AND NOT A VERCEL CRON. vercel.json holds two cron entries and the Hobby plan allows
# two — both are spent on the pre-read briefs, which are time-critical in a way this is not.
# GitHub's scheduler is free and already runs four other jobs here.
#
# WHY THIS CADENCE. The card fires only on a change, so a run that finds nothing costs one request
# and posts nothing. Every 30 minutes during waking hours is frequent enough that a swap shows up
# while it is still interesting, and infrequent enough that a day of no trading is ~30 silent runs
# rather than 1,440. GitHub bills a one-minute minimum per job, so this is roughly 30 minutes of CI
# a day against 2,000 free for a private repo, and unmetered for a public one.
#
# The endpoint is idempotent by construction: it advances its snapshot ONLY after Discord confirms
# the post, so a duplicate run posts nothing and a failed one retries on the next tick.
name: wallet card

on:
  schedule:
    - cron: '*/30 6-23 * * *'
  workflow_dispatch:

concurrency:
  group: walletcard
  cancel-in-progress: false      # a slow run finishes rather than leaving the snapshot half-moved

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Post the wallet card if anything changed
        run: |
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --max-time 90 \
            -H "x-tradecard-key: ${{ secrets.TRADECARD_KEY }}" \
            "https://dvcap.vercel.app/api/tradecard?card=wallet") || true
          echo "HTTP $code"; cat /tmp/out.json; echo
          if [ "$code" = "401" ]; then
            echo "::error::Refused. Vercel needs TRADECARD_KEY and this repo needs the same value as a secret."
            exit 1
          fi
          # The route answers 200 with a reason rather than failing, so a skipped run (no webhook
          # configured, Redis down, nothing changed) is visible in the log without turning it red.
          [ "$code" = "200" ] || exit 1
