# Pings the trades channel when QQQ's first 30 minutes confirm a moving day (lib/checkpointPing.js).
#
# WHY. The morning plans verdict says "free" on about 4 days in 10, and about 1 in 7 of those still turn
# into a big day. The 10:00 ET checkpoint (first 30 min range ≥ 0.50 × implied 1σ) is the safety net;
# this makes it a phone notification. Quiet and middle days post nothing.
#
# WHEN. Just after 10:00 New York. GitHub cron is UTC and has no DST, so both offsets are listed
# (14:xx UTC is 10:xx EDT, 15:xx UTC is 10:xx EST); the endpoint answers "outside 10:00–10:45 ET" for
# the pair that does not apply. The second run of each pair is a retry for a late or dropped schedule
# (GitHub's scheduler is best-effort); Redis keeps one ping per day, so a repeat is harmless.
# COST: 4 one-minute runs a weekday, ~20 minutes a week.
name: checkpoint ping

on:
  schedule:
    - cron: '2 14 * * 1-5'
    - cron: '14 14 * * 1-5'
    - cron: '2 15 * * 1-5'
    - cron: '14 15 * * 1-5'
  workflow_dispatch:

concurrency:
  group: checkpoint-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read the 10:00 checkpoint and ping on a confirm
        run: |
          # Same service key as the trade card (TRADECARD_KEY, docs/api-auth.md).
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --max-time 60 \
            -H "x-tradecard-key: ${{ secrets.TRADECARD_KEY }}" \
            "https://dvcap.vercel.app/api/tradecard?card=checkpoint") || true
          echo "HTTP $code"; cat /tmp/out.json; echo
          if [ "$code" = "401" ]; then
            echo "::error::Refused: the server and this workflow must share TRADECARD_KEY."
            exit 1
          fi
          [ "$code" = "200" ] || exit 1
