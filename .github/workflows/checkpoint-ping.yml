# The layered trade-day pings to the trades channel (lib/checkpointPing.js, docs/trade-day-plans.md):
#   08:40 ET  pre-open, Check and Desk days only: P with the futures gap, the lean, the 10:00 / 10:30 levels
#   10:00 ET  a confirm on every day; on Check and Desk days also "Quiet: stand down" / "Middle: re-check 10:30"
#   10:30 ET  only after a Check/Desk day's 10:00 middle: confirm or stand down
#
# WHEN. GitHub cron is UTC and has no DST, so each layer is listed at both offsets (12:xx/14:xx UTC are
# EDT, 13:xx/15:xx are EST). The endpoint picks the layer from the New York clock, and the offset that
# does not apply answers "outside the layer windows". Each layer has a retry about 12 minutes later,
# because GitHub's scheduler is best-effort. Redis keeps one post per layer per day, so a repeat is
# harmless. COST: 12 one-minute runs a weekday, about an hour a week.
name: checkpoint ping

on:
  schedule:
    - cron: '40 12 * * 1-5'    # 08:40 EDT
    - cron: '52 12 * * 1-5'
    - cron: '40 13 * * 1-5'    # 08:40 EST
    - cron: '52 13 * * 1-5'
    - cron: '2 14 * * 1-5'     # 10:02 EDT
    - cron: '14 14 * * 1-5'
    - cron: '2 15 * * 1-5'     # 10:02 EST
    - cron: '14 15 * * 1-5'
    - cron: '32 14 * * 1-5'    # 10:32 EDT
    - cron: '44 14 * * 1-5'
    - cron: '32 15 * * 1-5'    # 10:32 EST
    - cron: '44 15 * * 1-5'
  workflow_dispatch:

concurrency:
  group: checkpoint-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Post this layer's ping, if it has one
        run: |
          # Same service key as the trade card (TRADECARD_KEY, docs/api-auth.md).
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --max-time 60 \
            -H "x-tradecard-key: ${{ secrets.TRADECARD_KEY }}" \
            "https://dvcap.vercel.app/api/tradecard?card=checkpoint") || true
          echo "HTTP $code"; cat /tmp/out.json; echo
          if [ "$code" = "401" ]; then
            echo "::error::Refused: the server and this workflow must share TRADECARD_KEY."
            exit 1
          fi
          [ "$code" = "200" ] || exit 1
